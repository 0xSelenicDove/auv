// EXPERIMENTAL / UNSTABLE
syntax = "proto3";

package auv.api.driver.v1;

import "auv/api/annotations/v1/annotations.proto";
import "auv/api/driver/v1/geometry.proto";

service WindowService {
  // Windows UIA provider text, preserved verbatim. A bounded tree is not a
  // guarantee of complete, visible or semantically accurate application text.
  rpc SnapshotAccessibility(SnapshotWindowAccessibilityRequest) returns (SnapshotWindowAccessibilityResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_READ_ONLY;
    option (auv.api.annotations.v1.presentation) = {
      name: "window.accessibility"
      title: "Read window accessibility"
      description: "Reads bounded Windows UIA nodes with raw names and values; unavailable on other backends."
    };
  }
  rpc ListWindows(ListWindowsRequest) returns (ListWindowsResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_READ_ONLY;
    option (auv.api.annotations.v1.presentation) = {
      name: "windows.list"
      title: "List windows"
      description: "Lists the visible windows with their applications, titles, process IDs and frames in logical screen coordinates."
    };
  }
  rpc ResolveWindow(ResolveWindowRequest) returns (ResolveWindowResponse) {
    option (auv.api.annotations.v1.discoverable) = true;
    option (auv.api.annotations.v1.effect) = METHOD_EFFECT_READ_ONLY;
    option (auv.api.annotations.v1.presentation) = {
      name: "windows.resolve"
      title: "Find a window"
      description: "Finds one window by application (bundle ID, name, process ID or the frontmost app) and optionally by title."
    };
  }
}

message WindowRef {
  string window_id = 1;
}

message WindowSelector {
  oneof application {
    string application_bundle_id = 1;
    string application_name = 2;
    uint32 process_id = 3;
    bool frontmost_application = 4;
  }
  oneof window {
    string title_exact = 5;
    string title_contains = 6;
    bool main_visible = 7;
  }
}

message Window {
  WindowRef ref = 1;
  optional string title = 2;
  optional string application_name = 3;
  optional string application_bundle_id = 4;
  optional uint32 process_id = 5;
  ScreenRect frame = 6;
  bool is_main = 7;
  bool is_visible = 8;
}

message ListWindowsRequest {
  reserved 1;
  reserved "lease";
}

message ListWindowsResponse {
  repeated Window windows = 1;
}

message ResolveWindowRequest {
  reserved 1;
  reserved "lease";
  WindowSelector selector = 2;
}

message ResolveWindowResponse {
  Window window = 1;
}

message SnapshotWindowAccessibilityRequest {
  WindowRef window = 1;
}

message WindowAccessibilityNode {
  uint32 depth = 1;
  string path = 2;
  string control_type = 3;
  string name = 4;
  optional string value = 5;
  string automation_id = 6;
  string class_name = 7;
  bool focused = 8;
  // NOTICE(accessibility-bounds): node geometry is excluded until its Windows
  // DPI coordinate contract is validated. Ground input in a fresh capture.
}

message SnapshotWindowAccessibilityResponse {
  Window window = 1;
  repeated WindowAccessibilityNode nodes = 2;
  string backend = 3;
  uint32 max_depth = 4;
  uint32 max_nodes = 5;
  // The existing driver does not report whether a traversal limit was hit.
  bool completeness_known = 6;
}
